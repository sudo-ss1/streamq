syntax = "proto3";

package streamq.v1;

// ErrorCode is the per-request or per-partition result code (SPEC §7.3). gRPC status codes are
// used only for transport-level failures and malformed requests.
enum ErrorCode {
  ERROR_CODE_NONE = 0;
  ERROR_CODE_UNKNOWN_TOPIC_OR_PARTITION = 1;
  ERROR_CODE_TOPIC_ALREADY_EXISTS = 2;
  ERROR_CODE_INVALID_REPLICATION_FACTOR = 3;
  ERROR_CODE_NOT_LEADER = 4;
  ERROR_CODE_FENCED_LEADER_EPOCH = 5;
  ERROR_CODE_OFFSET_OUT_OF_RANGE = 6;
  ERROR_CODE_NOT_ENOUGH_REPLICAS = 7;
  ERROR_CODE_REQUEST_TIMED_OUT = 8;
  ERROR_CODE_CORRUPT_MESSAGE = 9;
  ERROR_CODE_MESSAGE_TOO_LARGE = 10;
  ERROR_CODE_OUT_OF_ORDER_SEQUENCE = 11;
  ERROR_CODE_UNKNOWN_PRODUCER_ID = 12;
  ERROR_CODE_ILLEGAL_GENERATION = 13;
  ERROR_CODE_REBALANCE_IN_PROGRESS = 14;
  ERROR_CODE_UNKNOWN_MEMBER_ID = 15;
  ERROR_CODE_NOT_COORDINATOR = 16;
  ERROR_CODE_NOT_CONTROLLER = 17;
  // Not in SPEC §7.3; see docs/DECISIONS.md.
  ERROR_CODE_INVALID_CONFIG = 18;
  ERROR_CODE_INVALID_TOPIC = 19;
  ERROR_CODE_UNKNOWN = 20;
  ERROR_CODE_INVALID_TIMESTAMP = 21;
  // Internal API: a broker heartbeat or request from a stale broker incarnation.
  ERROR_CODE_STALE_BROKER_EPOCH = 22;
  // Internal API: an AlterISR whose new ISR is invalid (not replicas, missing the leader, fenced
  // members).
  ERROR_CODE_INVALID_ISR = 23;
}

// StreamQService is the public client API (SPEC §7.1).
service StreamQService {
  // CreateTopic creates a topic.
  rpc CreateTopic(CreateTopicRequest) returns (CreateTopicResponse);
  // DeleteTopic deletes a topic and its data.
  rpc DeleteTopic(DeleteTopicRequest) returns (DeleteTopicResponse);
  // ListTopics lists topic names.
  rpc ListTopics(ListTopicsRequest) returns (ListTopicsResponse);
  // Metadata returns brokers and per-partition leadership.
  rpc Metadata(MetadataRequest) returns (MetadataResponse);
  // Produce appends one record batch per partition.
  rpc Produce(ProduceRequest) returns (ProduceResponse);
  // Fetch long-polls for records below the high watermark.
  rpc Fetch(FetchRequest) returns (FetchResponse);
  // ListOffsets resolves earliest, latest or timestamp offsets.
  rpc ListOffsets(ListOffsetsRequest) returns (ListOffsetsResponse);

  // FindCoordinator returns the coordinator of a consumer group (the controller, SPEC §5).
  rpc FindCoordinator(FindCoordinatorRequest) returns (FindCoordinatorResponse);
  // JoinGroup joins or rejoins a group; it returns when the rebalance completes.
  rpc JoinGroup(JoinGroupRequest) returns (JoinGroupResponse);
  // SyncGroup returns the member's assignment for the current generation.
  rpc SyncGroup(SyncGroupRequest) returns (SyncGroupResponse);
  // Heartbeat keeps a member alive and reports pending rebalances.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  // LeaveGroup removes a member, triggering a rebalance.
  rpc LeaveGroup(LeaveGroupRequest) returns (LeaveGroupResponse);
  // CommitOffset commits offsets for a group generation.
  rpc CommitOffset(CommitOffsetRequest) returns (CommitOffsetResponse);
  // FetchOffset returns committed offsets.
  rpc FetchOffset(FetchOffsetRequest) returns (FetchOffsetResponse);
  // ListGroups lists known groups.
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  // DescribeGroup describes a group's state, members and committed offsets.
  rpc DescribeGroup(DescribeGroupRequest) returns (DescribeGroupResponse);
}

message CreateTopicRequest {
  string name = 1;
  // <= 0 means the broker default.
  int32 partitions = 2;
  // <= 0 means the broker default.
  int32 replication_factor = 3;
  // Topic config overrides; keys are SPEC §10 topic_defaults keys.
  map<string, string> configs = 4;
}

message CreateTopicResponse {
  ErrorCode error_code = 1;
  string error_message = 2;
  // Controller hint for NOT_CONTROLLER; -1 if unknown.
  int32 controller_id = 3;
}

message DeleteTopicRequest {
  string name = 1;
}

message DeleteTopicResponse {
  ErrorCode error_code = 1;
  string error_message = 2;
  // Controller hint for NOT_CONTROLLER; -1 if unknown.
  int32 controller_id = 3;
}

message ListTopicsRequest {}

message ListTopicsResponse {
  repeated string names = 1;
}

message MetadataRequest {
  // Empty means all topics.
  repeated string topics = 1;
}

message Broker {
  int32 id = 1;
  string host = 2;
  int32 port = 3;
}

message PartitionMetadata {
  int32 partition = 1;
  ErrorCode error_code = 2;
  // -1 if the partition has no leader.
  int32 leader_id = 3;
  int32 leader_epoch = 4;
  repeated int32 replicas = 5;
  repeated int32 isr = 6;
}

message TopicMetadata {
  string name = 1;
  ErrorCode error_code = 2;
  repeated PartitionMetadata partitions = 3;
  map<string, string> configs = 4;
}

message MetadataResponse {
  repeated Broker brokers = 1;
  // -1 if unknown.
  int32 controller_id = 2;
  repeated TopicMetadata topics = 3;
}

// Acks selects when a produce is acknowledged (SPEC §4.5).
enum Acks {
  // Treated as ACKS_ALL.
  ACKS_UNSPECIFIED = 0;
  ACKS_NONE = 1;
  ACKS_LEADER = 2;
  ACKS_ALL = 3;
}

message ProducePartition {
  int32 partition = 1;
  // -1 skips the epoch check.
  int32 leader_epoch = 2;
  // Exactly one record batch (SPEC §3.5) with base_offset and leader_epoch set to 0.
  bytes records = 3;
}

message ProduceTopic {
  string topic = 1;
  repeated ProducePartition partitions = 2;
}

message ProduceRequest {
  Acks acks = 1;
  int32 timeout_ms = 2;
  repeated ProduceTopic topics = 3;
}

message ProducePartitionResponse {
  int32 partition = 1;
  ErrorCode error_code = 2;
  string error_message = 3;
  // Offset assigned to the batch's first record; -1 on error.
  int64 base_offset = 4;
  int64 log_start_offset = 5;
  // Current leader hint for NOT_LEADER / FENCED_LEADER_EPOCH; -1 if unknown.
  int32 leader_id = 6;
  int32 leader_epoch = 7;
}

message ProduceTopicResponse {
  string topic = 1;
  repeated ProducePartitionResponse partitions = 2;
}

message ProduceResponse {
  repeated ProduceTopicResponse topics = 1;
}

message FetchPartition {
  int32 partition = 1;
  // -1 skips the epoch check.
  int32 leader_epoch = 2;
  int64 fetch_offset = 3;
  int32 max_bytes = 4;
}

message FetchTopic {
  string topic = 1;
  repeated FetchPartition partitions = 2;
}

message FetchRequest {
  int32 max_wait_ms = 1;
  int32 min_bytes = 2;
  int32 max_bytes = 3;
  repeated FetchTopic topics = 4;
}

message FetchPartitionResponse {
  int32 partition = 1;
  ErrorCode error_code = 2;
  int64 high_watermark = 3;
  int64 log_start_offset = 4;
  // Zero or more whole record batches, all below the high watermark.
  bytes records = 5;
  int32 leader_id = 6;
  int32 leader_epoch = 7;
}

message FetchTopicResponse {
  string topic = 1;
  repeated FetchPartitionResponse partitions = 2;
}

message FetchResponse {
  repeated FetchTopicResponse topics = 1;
}

message ListOffsetsPartition {
  int32 partition = 1;
  // -1 skips the epoch check.
  int32 leader_epoch = 2;
  // -2 = earliest, -1 = latest (high watermark), >= 0 = first offset with timestamp >= it.
  int64 timestamp = 3;
}

message ListOffsetsTopic {
  string topic = 1;
  repeated ListOffsetsPartition partitions = 2;
}

message ListOffsetsRequest {
  repeated ListOffsetsTopic topics = 1;
}

message ListOffsetsPartitionResponse {
  int32 partition = 1;
  ErrorCode error_code = 2;
  // -1 if no record matches the timestamp.
  int64 offset = 3;
  // Timestamp of the record found by a timestamp lookup; -1 otherwise.
  int64 timestamp = 4;
  int32 leader_id = 5;
  int32 leader_epoch = 6;
}

message ListOffsetsTopicResponse {
  string topic = 1;
  repeated ListOffsetsPartitionResponse partitions = 2;
}

message ListOffsetsResponse {
  repeated ListOffsetsTopicResponse topics = 1;
}

message FindCoordinatorRequest {
  string group_id = 1;
}

message FindCoordinatorResponse {
  ErrorCode error_code = 1;
  Broker coordinator = 2;
  string error_message = 3;
}

message TopicPartitions {
  string topic = 1;
  repeated int32 partitions = 2;
}

message JoinGroupRequest {
  string group_id = 1;
  // Empty for a new member; the coordinator assigns one.
  string member_id = 2;
  int32 session_timeout_ms = 3;
  int32 rebalance_timeout_ms = 4;
  // Subscribed topics.
  repeated string topics = 5;
  // Supported assignors in preference order ("range", "roundrobin").
  repeated string assignors = 6;
}

message JoinGroupResponse {
  ErrorCode error_code = 1;
  int32 generation_id = 2;
  string member_id = 3;
  string assignor = 4;
  // The member's assignment, computed by the coordinator (SPEC §5).
  repeated TopicPartitions assignment = 5;
  string error_message = 6;
}

message SyncGroupRequest {
  string group_id = 1;
  string member_id = 2;
  int32 generation_id = 3;
}

message SyncGroupResponse {
  ErrorCode error_code = 1;
  repeated TopicPartitions assignment = 2;
  string error_message = 3;
}

message HeartbeatRequest {
  string group_id = 1;
  string member_id = 2;
  int32 generation_id = 3;
}

message HeartbeatResponse {
  ErrorCode error_code = 1;
  string error_message = 2;
}

message LeaveGroupRequest {
  string group_id = 1;
  string member_id = 2;
}

message LeaveGroupResponse {
  ErrorCode error_code = 1;
  string error_message = 2;
}

message OffsetCommit {
  string topic = 1;
  int32 partition = 2;
  int64 offset = 3;
}

message CommitOffsetRequest {
  string group_id = 1;
  // Empty with generation_id -1 for a standalone commit (group must have no members).
  string member_id = 2;
  int32 generation_id = 3;
  repeated OffsetCommit offsets = 4;
}

message CommitOffsetResponse {
  ErrorCode error_code = 1;
  string error_message = 2;
  // Per-partition results (request-level failures use error_code).
  repeated OffsetCommitResult results = 3;
}

message FetchOffsetRequest {
  string group_id = 1;
  // Empty means every committed partition of the group.
  repeated TopicPartitions partitions = 2;
}

message FetchOffsetResponse {
  ErrorCode error_code = 1;
  // offset is -1 for partitions without a committed offset.
  repeated OffsetCommit offsets = 2;
  string error_message = 3;
}

message ListGroupsRequest {}

message ListGroupsResponse {
  repeated string group_ids = 1;
  ErrorCode error_code = 2;
  string error_message = 3;
}

message OffsetCommitResult {
  string topic = 1;
  int32 partition = 2;
  ErrorCode error_code = 3;
}

message DescribeGroupRequest {
  string group_id = 1;
}

message GroupMember {
  string member_id = 1;
  repeated TopicPartitions assignment = 2;
}

message DescribeGroupResponse {
  ErrorCode error_code = 1;
  string group_id = 2;
  // Empty, PreparingRebalance or Stable.
  string state = 3;
  int32 generation_id = 4;
  string assignor = 5;
  repeated GroupMember members = 6;
  repeated OffsetCommit committed = 7;
  string error_message = 8;
}
