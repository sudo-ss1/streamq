syntax = "proto3";

package streamq.v1;

import "v1/streamq.proto";

// MetadataCommand is one versioned, deterministic metadata state change (SPEC §2.1). The local
// store (M2) and the Raft FSM (M5) apply the same commands. Timestamps come in the command.
message MetadataCommand {
  int32 version = 1;
  int64 timestamp_ms = 2;
  // For leader-issued commands, the Raft term the issuer acted in; the FSM rejects the entry if
  // it was committed in a different term (0 = not term-bound).
  uint64 controller_epoch = 3;
  oneof cmd {
    CreateTopicCommand create_topic = 10;
    DeleteTopicCommand delete_topic = 11;
    CommitOffsetsCommand commit_offsets = 12;
    RegisterBrokerCommand register_broker = 13;
    FenceBrokerCommand fence_broker = 14;
    UnfenceBrokerCommand unfence_broker = 15;
    AlterISRCommand alter_isr = 16;
    AllocateProducerIDsCommand allocate_producer_ids = 17;
  }
}

message CreateTopicCommand {
  string name = 1;
  map<string, string> configs = 2;
  repeated PartitionAssignment partitions = 3;
  // Unique id (32 hex chars) generated by the proposer; distinguishes a recreated topic from a
  // deleted one with the same name (DECISIONS D17).
  string topic_id = 4;
}

message PartitionAssignment {
  int32 partition = 1;
  repeated int32 replicas = 2;
}

message DeleteTopicCommand {
  string name = 1;
  // If set, the delete applies only to the topic with this id, so a retried delete can never
  // remove a recreated topic of the same name (DECISIONS D33).
  string topic_id = 2;
}

// CommitOffsetsCommand records a consumer group's committed offsets (SPEC §5).
message CommitOffsetsCommand {
  string group_id = 1;
  repeated OffsetCommit offsets = 2;
}

// RegisterBrokerCommand registers (or re-registers) a broker. It stays fenced until the
// controller unfences it once it has caught up on metadata (SPEC §2.3).
message RegisterBrokerCommand {
  int32 broker_id = 1;
  string host = 2;
  int32 port = 3;
  string internal_addr = 4;
}

// FenceBrokerCommand fences a broker that missed heartbeats: it leaves every ISR (except as the
// last member) and loses leadership (SPEC §2.3, §4.4).
message FenceBrokerCommand {
  int32 broker_id = 1;
  // The incarnation being fenced; a mismatch with the current epoch makes this a no-op.
  int64 broker_epoch = 2;
}

// UnfenceBrokerCommand unfences a caught-up broker; offline partitions it can lead re-elect it.
message UnfenceBrokerCommand {
  int32 broker_id = 1;
  // The incarnation being unfenced; a mismatch with the current epoch makes this a no-op.
  int64 broker_epoch = 2;
}

// AlterISRCommand changes a partition's ISR on behalf of its leader (SPEC §4.3). It applies only
// if leader_epoch and partition_epoch match the current ones.
message AlterISRCommand {
  string topic = 1;
  int32 partition = 2;
  int32 leader_epoch = 3;
  int32 partition_epoch = 4;
  repeated int32 new_isr = 5;
}

// StreamQInternalService is the broker-to-broker API (SPEC §7.2), served on internal_addr.
service StreamQInternalService {
  // RegisterBroker registers a broker with the controller.
  rpc RegisterBroker(RegisterBrokerRequest) returns (RegisterBrokerResponse);
  // BrokerHeartbeat keeps a broker alive and reports its metadata progress.
  rpc BrokerHeartbeat(BrokerHeartbeatRequest) returns (BrokerHeartbeatResponse);
  // ForwardMetadata applies a metadata command on the controller (follower forwarding).
  rpc ForwardMetadata(ForwardMetadataRequest) returns (ForwardMetadataResponse);
  // ReplicaFetch is a follower's pull from the partition leader (SPEC §4.1).
  rpc ReplicaFetch(ReplicaFetchRequest) returns (ReplicaFetchResponse);
  // OffsetForLeaderEpoch returns the end offset of an epoch on the leader (SPEC §4.4).
  rpc OffsetForLeaderEpoch(OffsetForLeaderEpochRequest) returns (OffsetForLeaderEpochResponse);
  // AlterISR asks the controller to change a partition's ISR (SPEC §4.3).
  rpc AlterISR(AlterISRRequest) returns (AlterISRResponse);
  // AllocateProducerIDs reserves a block of producer IDs for a broker (SPEC §6).
  rpc AllocateProducerIDs(AllocateProducerIDsRequest) returns (AllocateProducerIDsResponse);
}

message ReplicaFetchRequest {
  int32 replica_id = 1;
  string topic = 2;
  int32 partition = 3;
  int32 leader_epoch = 4;
  int64 fetch_offset = 5;
  int32 max_bytes = 6;
  int32 max_wait_ms = 7;
  // The follower's registration epoch; stale incarnations are rejected (KIP-903).
  int64 broker_epoch = 8;
}

message ReplicaFetchResponse {
  ErrorCode error_code = 1;
  string error_message = 2;
  int64 high_watermark = 3;
  int64 log_start_offset = 4;
  int64 log_end_offset = 5;
  // Whole batches from fetch_offset, up to the leader's LEO.
  bytes records = 6;
}

message OffsetForLeaderEpochRequest {
  string topic = 1;
  int32 partition = 2;
  // The follower's view of the current leader epoch (fencing check).
  int32 current_leader_epoch = 3;
  // The epoch whose end offset is wanted (the follower's latest epoch).
  int32 requested_epoch = 4;
}

message OffsetForLeaderEpochResponse {
  ErrorCode error_code = 1;
  string error_message = 2;
  // The largest leader epoch <= requested_epoch, or -1.
  int32 leader_epoch = 3;
  // That epoch's end offset, or -1.
  int64 end_offset = 4;
  // The leader's log start offset (for followers entirely below it).
  int64 log_start_offset = 5;
}

message AlterISRRequest {
  int32 leader_id = 1;
  string topic = 2;
  int32 partition = 3;
  int32 leader_epoch = 4;
  int32 partition_epoch = 5;
  repeated int32 new_isr = 6;
}

message AlterISRResponse {
  ErrorCode error_code = 1;
  string error_message = 2;
  int32 controller_id = 3;
}

// AllocateProducerIDsCommand reserves the next block of producer IDs for a broker (SPEC §6).
message AllocateProducerIDsCommand {
  int32 broker_id = 1;
}

message AllocateProducerIDsRequest {
  int32 broker_id = 1;
  int64 broker_epoch = 2;
}

message AllocateProducerIDsResponse {
  ErrorCode error_code = 1;
  string error_message = 2;
  int64 first_id = 3;
  int32 count = 4;
  int32 controller_id = 5;
}

message RegisterBrokerRequest {
  int32 broker_id = 1;
  string host = 2;
  int32 port = 3;
  string internal_addr = 4;
}

message RegisterBrokerResponse {
  ErrorCode error_code = 1;
  string error_message = 2;
  int64 broker_epoch = 3;
  // Controller hint for NOT_CONTROLLER; -1 if unknown.
  int32 controller_id = 4;
  // The broker must have processed metadata up to this index before opening its partitions.
  uint64 catch_up_index = 5;
}

message BrokerHeartbeatRequest {
  int32 broker_id = 1;
  int64 broker_epoch = 2;
  uint64 applied_index = 3;
}

message BrokerHeartbeatResponse {
  ErrorCode error_code = 1;
  string error_message = 2;
  bool fenced = 3;
  int32 controller_id = 4;
}

message ForwardMetadataRequest {
  MetadataCommand command = 1;
}

message ForwardMetadataResponse {
  ErrorCode error_code = 1;
  string error_message = 2;
  int32 controller_id = 3;
  // Raft index of the applied command; the forwarder waits until it has applied it locally.
  uint64 index = 4;
}
