syntax = "proto3";

package streamq.v1;

// MetadataCommand is one versioned, deterministic metadata state change (SPEC §2.1). The local
// store (M2) and the Raft FSM (M5) apply the same commands. Timestamps come in the command.
message MetadataCommand {
  int32 version = 1;
  int64 timestamp_ms = 2;
  oneof cmd {
    CreateTopicCommand create_topic = 10;
    DeleteTopicCommand delete_topic = 11;
  }
}

message CreateTopicCommand {
  string name = 1;
  map<string, string> configs = 2;
  repeated PartitionAssignment partitions = 3;
  // Unique id (32 hex chars) generated by the proposer; distinguishes a recreated topic from a
  // deleted one with the same name (DECISIONS D17).
  string topic_id = 4;
}

message PartitionAssignment {
  int32 partition = 1;
  repeated int32 replicas = 2;
}

message DeleteTopicCommand {
  string name = 1;
}
