version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - contextcheck
    - copyloopvar
    - errorlint
    - forbidigo
    - gochecknoglobals
    - gochecknoinits
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - sloglint
    - testifylint
    - thelper
    - unconvert
    - unparam
  settings:
    forbidigo:
      # CLI output goes through fmt.Fprint*(cmd.OutOrStdout(), ...); logging through slog.
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: use fmt.Fprint* with an explicit writer, or slog for logging
        - pattern: ^log\.(Print|Fatal|Panic).*$
          msg: use log/slog
    gosec:
      excludes:
        - G115 # integer overflow conversions: sizes are validated explicitly in binary encoding
    nolintlint:
      require-explanation: true
      require-specific: true
    revive:
      rules:
        - name: exported
        - name: package-comments
    sloglint:
      kv-only: false
      attr-only: false
      no-mixed-args: true
  exclusions:
    generated: strict
    paths:
      - ^gen/

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false # report every linter's finding, not just the first per line

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sudo-ss1/streamq
  exclusions:
    paths:
      - ^gen/
